<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1 Souvenirs | IOI 2025</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #loader-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 20px;
            font-weight: bold;
            color: #475569;
            letter-spacing: 2px;
            z-index: 50;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #main-content {
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        #main-content.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .snippet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background-color: #f9fafb;
            border-bottom: 1px solid #d1d5db;
            flex-shrink: 0; 
        }
        .snippet-title {
            font-size: 16px;
            font-weight: 600;
            color: #111827;
            margin: 0;
            font-family: 'Consolas', 'Monaco', monospace;
        }
        .snippet-meta {
            font-size: 13px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .content-body {
            overflow-y: auto;
            scrollbar-width: thin;
            background-color: #fafafa;
        }

        .section-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background-color: #e5e7eb;
            color: #4b5563;
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px solid #d1d5db;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .section-divider.first {
            border-top: none;
        }
        
        .section-divider.middle {
            border-top: 1px solid #d1d5db;
        }

        /* 預覽圖片容器通用樣式 */
        .preview-container {
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .pdf-bg {
            background-color: #94a3b8; 
        }

        .code-bg {
            background-color: #fdfdfd;
        }

        .preview-container img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
            pointer-events: none; 
            display: block;
        }

        /* 滾動條美化 */
        .content-body::-webkit-scrollbar {
            width: 8px;
        }
        .content-body::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .content-body::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        .content-body::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }

    </style>
</head>
<body oncontextmenu="return false;" oncopy="return false;" oncut="return false;" ondragstart="return false;" ondrop="return false;">

    <div id="loader-container">INITIALIZING...</div>

    <div id="main-content">
        <div class="snippet-header">
            <h1 class="snippet-title">souvenirs.cpp</h1>
            <span class="snippet-meta">IOI 2025 Day 1</span>
        </div>
        
        <div class="content-body">
            
            <div class="section-divider first">PROBLEM DESCRIPTION PREVIEW</div>
            <div class="preview-container pdf-bg">
                <img src="pdf_page_1.jpg" alt="Problem Statement Page 1">
                <img src="pdf_page_2.jpg" alt="Problem Statement Page 2">
                <img src="pdf_page_3.jpg" alt="Problem Statement Page 3">
                <img src="pdf_page_4.jpg" alt="Problem Statement Page 4">
            </div>

            <div class="section-divider middle">SOURCE CODE</div>
            <div class="preview-container code-bg">
                <img src="souvenirs_code_quiz_plain.png" alt="Source Code Snapshot">
            </div>

        </div>
    </div>
    
    <script>
        const targetText = "IOI 2025 Souvenirs";
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*><";
        const loaderContainer = document.getElementById('loader-container');
        const mainContent = document.getElementById('main-content');
        let scrambleInterval;
        let iteration = 0;

        function runScramble() {
            scrambleInterval = setInterval(() => {
                loaderContainer.innerText = targetText.split("").map((char, index) => {
                    if (index < iteration) return targetText[index];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join("");
                iteration += 1 / 2;
                if (iteration >= targetText.length) {
                    clearInterval(scrambleInterval);
                    setTimeout(finishBootAnimation, 500);
                }
            }, 30);
        }

        function finishBootAnimation() {
            loaderContainer.style.opacity = "0";
            loaderContainer.style.transform = "translate(-50%, -50%) scale(1.1)";
            
            setTimeout(() => {
                loaderContainer.style.display = "none";
                mainContent.classList.add('show');
            }, 500);
        }

        window.onload = () => {
            setTimeout(runScramble, 300); 
        };

        // 鍵盤防護
        document.onkeydown = function(e) {
            if (e.keyCode === 123) { return false; } 
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) { return false; } 
            if (e.ctrlKey && e.shiftKey && e.keyCode === 67) { return false; } 
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) { return false; } 
            if (e.ctrlKey && e.keyCode === 85) { return false; } 
            if (e.ctrlKey && e.keyCode === 83) { return false; } 
            if (e.ctrlKey && e.keyCode === 80) { return false; } 
        };
        
        window.addEventListener('contextmenu', function (e) { 
            e.preventDefault(); 
        }, false);
    </script>
</body>
</html>
